databases:
  - name: jobs-postgres
    databaseName: jobs
    user: jobs
    plan: free

services:
  - type: web
    name: jobsphere
    runtime: python
    plan: free
    rootDir: .
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --no-input && python seed_jobs.py"
    startCommand: "python create_superuser.py && gunicorn myproject.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "false"
      - key: RENDER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobs-postgres
          property: connectionString
      - key: WEB_CONCURRENCY
        value: 2
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@jobboard.com
      - key: ADMIN_PASSWORD
        sync: false
